name: roteiro-java

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cursos
      POSTGRES_USER: cursos
      POSTGRES_PASSWORD: cursos
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cursos -d cursos"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./course-api
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cursos
      SPRING_DATASOURCE_USERNAME: cursos
      SPRING_DATASOURCE_PASSWORD: cursos
      JWT_SECRET: course-local-hmac-secret-with-32-bytes-min
      APP_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 50s

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
